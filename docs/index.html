<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>asciitime</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --border: #d0d0d0;
    --panel: #f7f7f7;
    --accent: #2563eb;
    --error: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e6e6e6;
      --muted: #9a9a9a;
      --border: #333941;
      --panel: #1c1f24;
      --accent: #5b8def;
      --error: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0 0 0.25rem;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 1.25rem;
    font-size: 0.9rem;
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    align-items: start;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }
  .panel {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    padding: 0.75rem;
  }
  .panel h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 0.5rem;
  }
  .panel-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.5rem;
  }
  .panel-header h2 {
    margin: 0;
  }
  .panel-header button {
    font-size: 0.75rem;
    padding: 0.2rem 0.5rem;
  }
  pre {
    width: 100%;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.85rem;
    line-height: 1.4;
    margin: 0;
    height: 420px;
    overflow: auto;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.6rem;
    white-space: pre;
  }
  #editor {
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin: 0.6rem 0;
    flex-wrap: wrap;
  }
  label {
    font-size: 0.85rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  input[type="number"] {
    width: 5rem;
    font-family: inherit;
    font-size: 0.85rem;
    padding: 0.3rem 0.4rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--fg);
  }
  button {
    font-size: 0.85rem;
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  button.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  button:hover { filter: brightness(1.05); }
  .error {
    color: var(--error);
    font-size: 0.85rem;
    margin: 0.4rem 0 0;
    white-space: pre-wrap;
  }
  .status {
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <h1>asciitime</h1>
  <p class="sub">Paste a timeline YAML definition and get back an ASCII diagram — rendered entirely in your browser via WebAssembly.</p>

  <div class="controls">
    <button id="load-absolute">Load absolute example</button>
    <button id="load-symbolic">Load symbolic example</button>
    <button id="format-btn">Format</button>
    <label>width <input type="number" id="width" placeholder="auto"></label>
    <button id="render-btn" class="primary">Render</button>
    <button id="copy-link-btn">Copy link</button>
    <span id="copy-status" class="status"></span>
    <span id="status" class="status">loading…</span>
  </div>

  <div class="controls">
    <label>shift events/windows after <input type="number" id="shift-after" placeholder="T"></label>
    <label>by <input type="number" id="shift-by" placeholder="+N"></label>
    <button id="shift-btn">Apply shift</button>
    <span id="shift-status" class="status"></span>
  </div>

  <div class="layout">
    <div class="panel">
      <h2>YAML</h2>
      <div id="editor"></div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h2>Output</h2>
        <button id="copy-diagram-btn">Copy diagram</button>
        <span id="copy-diagram-status" class="status"></span>
      </div>
      <pre id="output"></pre>
      <div id="error" class="error" hidden></div>
    </div>
  </div>

<script src="wasm_exec.js"></script>
<script type="module">
// The unscoped "codemirror" package resolves to the legacy CodeMirror
// 5 API, not the CM6 bundle its version number suggests — so basicSetup
// is assembled by hand here from the actual CM6 scoped packages
// instead, matching the composition of the real basicSetup helper.
import {
  EditorView, keymap, lineNumbers, highlightActiveLineGutter, highlightSpecialChars,
  drawSelection, dropCursor, rectangularSelection, crosshairCursor, highlightActiveLine,
} from "https://esm.sh/@codemirror/view@6";
import { EditorState, Compartment, Prec } from "https://esm.sh/@codemirror/state@6";
import {
  HighlightStyle, syntaxHighlighting, indentOnInput, bracketMatching, foldGutter, foldKeymap,
} from "https://esm.sh/@codemirror/language@6";
import { defaultKeymap, history as cmHistory, historyKeymap, indentWithTab } from "https://esm.sh/@codemirror/commands@6";
import { autocompletion, completionKeymap, closeBrackets, closeBracketsKeymap, completionStatus } from "https://esm.sh/@codemirror/autocomplete@6";
import { yaml as yamlLang } from "https://esm.sh/@codemirror/lang-yaml@6";
import { tags as t } from "https://esm.sh/@lezer/highlight@1";
import * as jsyaml from "https://esm.sh/js-yaml@4";

// defaultHighlightStyle assumes a light background and colors YAML
// keys a dark blue that's hard to read on the dark theme — so instead
// of that, two explicit HighlightStyles (light/dark) are defined here
// and swapped by the same media-query listener that swaps the editor
// theme below. propertyName/attributeName/definition are all covered
// for the key color since which exact tag a grammar emits for mapping
// keys varies.
const highlightCompartment = new Compartment();

function highlightStyle(dark) {
  if (dark) {
    return HighlightStyle.define([
      { tag: [t.propertyName, t.attributeName, t.definition(t.propertyName)], color: '#7ee8fa' },
      { tag: [t.string, t.special(t.string)], color: '#ffab70' },
      { tag: [t.number, t.bool, t.atom, t.null], color: '#f0883e' },
      { tag: t.comment, color: '#8b949e', fontStyle: 'italic' },
      { tag: [t.punctuation, t.meta, t.separator], color: '#c9d1d9' },
      { tag: t.invalid, color: '#ff6b6b' },
    ]);
  }
  return HighlightStyle.define([
    { tag: [t.propertyName, t.attributeName, t.definition(t.propertyName)], color: '#0550ae' },
    { tag: [t.string, t.special(t.string)], color: '#a11' },
    { tag: [t.number, t.bool, t.atom, t.null], color: '#905' },
    { tag: t.comment, color: '#6a737d', fontStyle: 'italic' },
    { tag: [t.punctuation, t.meta, t.separator], color: '#444' },
    { tag: t.invalid, color: '#b91c1c' },
  ]);
}

const basicSetup = [
  lineNumbers(),
  highlightActiveLineGutter(),
  highlightSpecialChars(),
  cmHistory(),
  foldGutter(),
  drawSelection(),
  dropCursor(),
  EditorState.allowMultipleSelections.of(true),
  indentOnInput(),
  highlightCompartment.of(syntaxHighlighting(highlightStyle(matchMedia('(prefers-color-scheme: dark)').matches), { fallback: true })),
  bracketMatching(),
  closeBrackets(),
  autocompletion(),
  rectangularSelection(),
  crosshairCursor(),
  highlightActiveLine(),
  keymap.of([
    ...closeBracketsKeymap,
    ...defaultKeymap,
    ...historyKeymap,
    ...foldKeymap,
    ...completionKeymap,
    indentWithTab,
  ]),
];

const ABSOLUTE_EXAMPLE = `title: Contracts
axis: absolute

windows:
  - id: A
    label: Contract A
    start: 2026-01-05T00:00:00Z
    end: 2026-03-01T00:00:00Z
  - id: B
    label: Contract B
    start: 2026-02-10T00:00:00Z
    end: 2026-04-01T00:00:00Z

events:
  - id: E1
    label: Signed
    time: 2026-02-01T00:00:00Z
  - id: E2
    label: Amendment
    time: 2026-02-10T00:00:00Z
    logged_at: 2026-03-05T00:00:00Z
`;

const SYMBOLIC_EXAMPLE = `title: Protocol Trace
axis: symbolic

options:
  stack_clashing_events: true

windows:
  - id: A
    label: Session A
    start: 0
    end: 4
  - id: B
    label: Session B
    start: 2
    end: 6

events:
  - id: E1
    label: Handshake
    time: 1
  - id: E2
    label: Ack
    time: 2
  - id: E3
    label: Retry
    time: 2
`;

const outputEl = document.getElementById('output');
const errorEl = document.getElementById('error');
const statusEl = document.getElementById('status');
const widthEl = document.getElementById('width');
const copyStatusEl = document.getElementById('copy-status');
const copyDiagramStatusEl = document.getElementById('copy-diagram-status');
const shiftAfterEl = document.getElementById('shift-after');
const shiftByEl = document.getElementById('shift-by');
const shiftStatusEl = document.getElementById('shift-status');

// --- Editor: syntax highlighting, autoindent, schema-aware autocomplete ---
//
// basicSetup (from the "codemirror" convenience bundle) already wires
// up line numbers, bracket matching, history/undo, an autocomplete UI,
// and Enter-key indentation via the default keymap. On top of that we
// add: YAML syntax highlighting (@codemirror/lang-yaml), a completion
// source tailored to this tool's specific schema (top-level keys,
// window/event item fields, and enum-like values for axis/
// stack_clashing_events), a custom Enter handler that increases indent
// after a line ending in ':' — which the generic YAML grammar doesn't
// know is meaningful the way e.g. a curly brace would be — and a
// light/dark theme that tracks the OS preference the same way the
// rest of the page's CSS does.

const SECTION_ITEM_FIELDS = {
  windows: [
    { label: 'id', detail: 'window id (optional — auto A, B, C…)' },
    { label: 'label', detail: 'shown in the legend' },
    { label: 'start', detail: 'axis position' },
    { label: 'end', detail: 'axis position' },
  ],
  events: [
    { label: 'id', detail: 'event id (optional — auto E1, E2…)' },
    { label: 'label', detail: 'shown in the legend' },
    { label: 'time', detail: 'effective axis position' },
    { label: 'logged_at', detail: 'optional — marks the event backdated' },
    { label: 'group', detail: 'optional — clusters events into their own block' },
  ],
};

const TOP_LEVEL_FIELDS = [
  { label: 'title', detail: 'diagram title' },
  { label: 'axis', detail: '"absolute" or "symbolic"' },
  { label: 'options', detail: 'rendering options' },
  { label: 'windows', detail: 'list of time spans' },
  { label: 'events', detail: 'list of points in time' },
];

const OPTIONS_FIELDS = [
  { label: 'stack_clashing_events', detail: 'default false — merges same-column events' },
];

function leadingWhitespace(text) {
  return (text.match(/^[ \t]*/) || [''])[0];
}

// Walks upward from the current line to find which section (windows /
// events / options) this position is nested under, by tracking the
// nearest shallower-indented line at each step. Good enough for this
// tool's flat two-level schema without needing a real YAML parse.
function detectSection(state, pos) {
  const line = state.doc.lineAt(pos);
  let indent = leadingWhitespace(line.text).length;
  for (let n = line.number - 1; n >= 1; n--) {
    const l = state.doc.line(n);
    const text = l.text;
    if (!text.trim()) continue;
    const lIndent = leadingWhitespace(text).length;
    if (lIndent < indent) {
      const key = text.trim().replace(/^-\s*/, '').replace(/:.*$/, '');
      if (key === 'windows' || key === 'events' || key === 'options') return key;
      indent = lIndent;
      if (lIndent === 0) continue;
    }
  }
  return 'top';
}

function yamlCompletions(context) {
  const line = context.state.doc.lineAt(context.pos);
  const beforeCursor = line.text.slice(0, context.pos - line.from);

  // Value position: "axis: |" or "stack_clashing_events: |"
  let m = beforeCursor.match(/^\s*axis:\s*(\w*)$/);
  if (m) {
    return {
      from: context.pos - m[1].length,
      options: ['absolute', 'symbolic'].map(label => ({ label, type: 'constant' })),
    };
  }
  m = beforeCursor.match(/^\s*stack_clashing_events:\s*(\w*)$/);
  if (m) {
    return {
      from: context.pos - m[1].length,
      options: ['true', 'false'].map(label => ({ label, type: 'constant' })),
    };
  }

  // Key position: start of a line (optionally after "- ", optionally
  // already partway through typing a key).
  const word = context.matchBefore(/[\w-]*/);
  if (!word) return null;
  if (word.from === word.to && !context.explicit) return null;

  const linePrefix = beforeCursor.slice(0, beforeCursor.length - (word.to - word.from));
  if (!/^[ \t]*(-\s*)?$/.test(linePrefix)) return null; // not at a key position

  const section = detectSection(context.state, line.from);
  const fields = SECTION_ITEM_FIELDS[section] || (section === 'options' ? OPTIONS_FIELDS : TOP_LEVEL_FIELDS);
  return {
    from: word.from,
    options: fields.map(f => ({ label: f.label, detail: f.detail, type: 'property', apply: f.label + ': ' })),
  };
}

// Enter continues the current line's indentation and adds one level
// after a line ending in ':' (opening a mapping or, for "- key:",
// staying at the list item's own indent plus two).
function yamlSmartNewline(view) {
  // Defer to the completion popup's own Enter-accepts binding when one
  // is open — otherwise this handler's Prec.highest wins the race and
  // inserts a raw newline instead of accepting the selected suggestion.
  if (completionStatus(view.state)) return false;
  const { state } = view;
  const sel = state.selection.main;
  if (!sel.empty) return false;
  const line = state.doc.lineAt(sel.from);
  const ws = leadingWhitespace(line.text);
  const trimmed = line.text.trim();
  let indent = ws;
  if (trimmed.endsWith(':')) indent += '  ';
  view.dispatch(state.update(state.replaceSelection('\n' + indent), { scrollIntoView: true, userEvent: 'input' }));
  return true;
}

const themeCompartment = new Compartment();

function editorTheme(dark) {
  const vars = dark
    ? { bg: '#14161a', fg: '#e6e6e6', gutterFg: '#5c636e', selection: '#2a3f66', activeLine: '#1c1f24' }
    : { bg: '#ffffff', fg: '#1a1a1a', gutterFg: '#8a8f98', selection: '#cfe0ff', activeLine: '#f7f7f7' };
  return EditorView.theme({
    '&': { backgroundColor: vars.bg, color: vars.fg, height: '420px' },
    '.cm-content': { fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace', fontSize: '0.85rem' },
    '.cm-gutters': { backgroundColor: vars.bg, color: vars.gutterFg, border: 'none' },
    '.cm-activeLine': { backgroundColor: vars.activeLine },
    '.cm-activeLineGutter': { backgroundColor: vars.activeLine },
    '.cm-selectionBackground, &.cm-focused .cm-selectionBackground': { backgroundColor: vars.selection + ' !important' },
    '.cm-scroller': { overflow: 'auto' },
  }, { dark });
}

const editorContainer = document.getElementById('editor');
const editorView = new EditorView({
  state: EditorState.create({
    doc: '',
    extensions: [
      basicSetup,
      yamlLang(),
      Prec.highest(keymap.of([{ key: 'Enter', run: yamlSmartNewline }])),
      EditorView.updateListener.of(update => { if (update.docChanged) onEdit(); }),
      themeCompartment.of(editorTheme(matchMedia('(prefers-color-scheme: dark)').matches)),
      yamlLang().language.data.of({ autocomplete: yamlCompletions }),
    ],
  }),
  parent: editorContainer,
});

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
  editorView.dispatch({
    effects: [
      themeCompartment.reconfigure(editorTheme(e.matches)),
      highlightCompartment.reconfigure(syntaxHighlighting(highlightStyle(e.matches), { fallback: true })),
    ],
  });
});

function getYaml() {
  return editorView.state.doc.toString();
}
function setYaml(text) {
  editorView.dispatch({ changes: { from: 0, to: editorView.state.doc.length, insert: text } });
}

function doRender() {
  if (typeof window.asciitimeRender !== 'function') return;
  const widthVal = widthEl.value.trim();
  const width = widthVal ? parseInt(widthVal, 10) : 0;
  const res = window.asciitimeRender(getYaml(), width);
  if (res.error) {
    errorEl.textContent = res.error;
    errorEl.hidden = false;
    outputEl.textContent = '';
  } else {
    errorEl.hidden = true;
    outputEl.textContent = res.output;
  }
}

document.getElementById('format-btn').addEventListener('click', () => {
  try {
    const parsed = jsyaml.load(getYaml());
    const formatted = jsyaml.dump(parsed, { indent: 2, lineWidth: -1, noRefs: true });
    setYaml(formatted);
    doRender();
    updateHashFromState();
  } catch (e) {
    errorEl.textContent = 'Could not format: ' + e.message;
    errorEl.hidden = false;
  }
});

// --- Shift: insert time into an existing schedule -------------------
//
// Shifts every event/window timestamp strictly after a pivot point by
// a fixed amount, so adding a new event somewhere in the middle of an
// existing diagram doesn't mean hand-adjusting every entry after it.
// Symbolic axis only — the absolute (date) axis would need a duration
// parser (14d, 2w, ...), which isn't worth the complexity for how
// rarely a date-based diagram needs bulk-rescheduling versus a
// protocol/sequence-style one.
//
// Each timestamp field is compared to the pivot independently, not
// per-event/per-window as a whole — so a window straddling the pivot
// gets longer (its end shifts, its start doesn't) rather than moving
// wholesale. That's the correct behavior for "insert time here": work
// already in progress at the pivot takes longer, it doesn't teleport.
function shiftValue(v, pivot, delta) {
  return typeof v === 'number' && v > pivot ? v + delta : v;
}

document.getElementById('shift-btn').addEventListener('click', () => {
  shiftStatusEl.textContent = '';
  const pivot = Number(shiftAfterEl.value);
  const delta = Number(shiftByEl.value);
  if (shiftAfterEl.value.trim() === '' || Number.isNaN(pivot)) {
    shiftStatusEl.textContent = 'enter a valid "after" value';
    return;
  }
  if (shiftByEl.value.trim() === '' || Number.isNaN(delta) || delta === 0) {
    shiftStatusEl.textContent = 'enter a non-zero shift amount';
    return;
  }

  let parsed;
  try {
    parsed = jsyaml.load(getYaml());
  } catch (e) {
    errorEl.textContent = 'Could not parse YAML: ' + e.message;
    errorEl.hidden = false;
    return;
  }

  if (!parsed || parsed.axis !== 'symbolic') {
    shiftStatusEl.textContent = 'shift only works on the symbolic axis';
    return;
  }

  for (const w of parsed.windows || []) {
    w.start = shiftValue(w.start, pivot, delta);
    w.end = shiftValue(w.end, pivot, delta);
  }
  for (const e of parsed.events || []) {
    e.time = shiftValue(e.time, pivot, delta);
    if (e.logged_at !== undefined) e.logged_at = shiftValue(e.logged_at, pivot, delta);
  }

  const formatted = jsyaml.dump(parsed, { indent: 2, lineWidth: -1, noRefs: true });
  setYaml(formatted);
  doRender();
  updateHashFromState();
  shiftStatusEl.textContent = 'shifted!';
  setTimeout(() => { shiftStatusEl.textContent = ''; }, 2000);
});

// --- Sharing state via the URL fragment -----------------------------
//
// The YAML (and width, if set) round-trips through the URL fragment
// so a page reload or a pasted link reproduces the exact diagram. The
// fragment is gzip-compressed when the browser supports
// CompressionStream (most do) to keep links reasonably short, with a
// one-byte prefix ("z" compressed, "p" plain) so old links written by
// a browser without CompressionStream still decode correctly anywhere.
// The fragment is never sent to any server — GitHub Pages doesn't even
// see it — so this works entirely client-side.

function bytesToBase64Url(bytes) {
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function base64UrlToBytes(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  const binary = atob(str);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

async function encodeYAML(text) {
  if (typeof CompressionStream === 'function') {
    const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
    const buf = await new Response(stream).arrayBuffer();
    return 'z' + bytesToBase64Url(new Uint8Array(buf));
  }
  return 'p' + bytesToBase64Url(new TextEncoder().encode(text));
}

async function decodeYAML(encoded) {
  const kind = encoded[0];
  const bytes = base64UrlToBytes(encoded.slice(1));
  if (kind === 'z') {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const buf = await new Response(stream).arrayBuffer();
    return new TextDecoder().decode(buf);
  }
  return new TextDecoder().decode(bytes);
}

async function stateFromHash() {
  const raw = location.hash.replace(/^#/, '');
  if (!raw) return null;
  const params = new URLSearchParams(raw);
  const y = params.get('y');
  if (!y) return null;
  try {
    const yaml = await decodeYAML(y);
    const w = params.get('w');
    return { yaml, width: w ? parseInt(w, 10) : null };
  } catch (e) {
    console.warn('asciitime: could not decode shared link, ignoring', e);
    return null;
  }
}

async function updateHashFromState() {
  const params = new URLSearchParams();
  params.set('y', await encodeYAML(getYaml()));
  const widthVal = widthEl.value.trim();
  if (widthVal) params.set('w', widthVal);
  history.replaceState(null, '', '#' + params.toString());
}

let renderTimer, shareTimer;
function scheduleRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(doRender, 250);
}
function scheduleShareUpdate() {
  clearTimeout(shareTimer);
  shareTimer = setTimeout(updateHashFromState, 400);
}
function onEdit() {
  scheduleRender();
  scheduleShareUpdate();
}

widthEl.addEventListener('input', onEdit);
document.getElementById('render-btn').addEventListener('click', doRender);
document.getElementById('load-absolute').addEventListener('click', () => {
  setYaml(ABSOLUTE_EXAMPLE);
  doRender();
  updateHashFromState();
});
document.getElementById('load-symbolic').addEventListener('click', () => {
  setYaml(SYMBOLIC_EXAMPLE);
  doRender();
  updateHashFromState();
});

function legacyCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  const ok = document.execCommand('copy');
  document.body.removeChild(ta);
  if (!ok) throw new Error('execCommand copy was rejected');
}

async function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(text);
      return;
    } catch (e) {
      // Some environments (embedded frames, certain permission
      // policies) reject the Clipboard API even in a secure context —
      // fall back to the legacy method instead of surfacing an error.
      legacyCopy(text);
      return;
    }
  }
  legacyCopy(text);
}

document.getElementById('copy-link-btn').addEventListener('click', async () => {
  try {
    await updateHashFromState();
    await copyToClipboard(location.href);
    copyStatusEl.textContent = 'link copied!';
  } catch (e) {
    copyStatusEl.textContent = 'copy failed — select the address bar instead';
  }
  setTimeout(() => { copyStatusEl.textContent = ''; }, 2500);
});

document.getElementById('copy-diagram-btn').addEventListener('click', async () => {
  if (!outputEl.textContent) {
    copyDiagramStatusEl.textContent = 'nothing to copy';
  } else {
    try {
      await copyToClipboard(outputEl.textContent);
      copyDiagramStatusEl.textContent = 'diagram copied!';
    } catch (e) {
      copyDiagramStatusEl.textContent = 'copy failed — select the output instead';
    }
  }
  setTimeout(() => { copyDiagramStatusEl.textContent = ''; }, 2500);
});

async function loadWasm() {
  const go = new Go();
  let result;
  try {
    result = await WebAssembly.instantiateStreaming(fetch('main.wasm'), go.importObject);
  } catch (e) {
    // Falls back to non-streaming instantiation for servers that don't
    // send application/wasm as the Content-Type (some local dev
    // servers, mainly — GitHub Pages sets it correctly).
    const resp = await fetch('main.wasm');
    const bytes = await resp.arrayBuffer();
    result = await WebAssembly.instantiate(bytes, go.importObject);
  }
  go.run(result.instance);
  statusEl.textContent = 'ready';

  const shared = await stateFromHash();
  if (shared) {
    setYaml(shared.yaml);
    if (shared.width) widthEl.value = String(shared.width);
  } else {
    setYaml(ABSOLUTE_EXAMPLE);
  }
  doRender();
}

loadWasm().catch((err) => {
  statusEl.textContent = 'failed to load';
  errorEl.textContent = 'Failed to load the WebAssembly module: ' + err;
  errorEl.hidden = false;
});
